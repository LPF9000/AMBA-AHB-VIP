name: AHB-Lite validation
on:
    pull_request:
    push:
        branches:
            - main
            - setup/**
            - feat/**
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ahb-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    language-and-activation:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        env:
            CCACHE_DISABLE: '1'
            VERILATOR_REVISION: ea338be98e1e838d3518809ce8899f85a009963c
        steps:
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
              with:
                  submodules: false
            - name: Install build dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends autoconf bison flex g++ help2man libfl-dev make python3-venv zlib1g-dev
                  python3 -m venv /tmp/checker-tools
                  /tmp/checker-tools/bin/python -m pip install uv==0.12.21
                  git submodule update --init checkers
                  /tmp/checker-tools/bin/uv venv --python 3.14 .toolchain/ci-python
                  /tmp/checker-tools/bin/uv pip install --python .toolchain/ci-python/bin/python --require-hashes -r tools/ci/requirements.txt
                  git clone https://github.com/accellera-official/uvm-core.git .toolchain/uvm-core
                  git -C .toolchain/uvm-core checkout --detach 78c06547a2a0a29b3dc9dcafae62b75b2ff61544
            - name: Build pinned Verilator 5.052
              run: |
                  git init /tmp/verilator-src
                  git -C /tmp/verilator-src remote add origin https://github.com/verilator/verilator.git
                  git -C /tmp/verilator-src fetch --depth=1 origin "$VERILATOR_REVISION"
                  git -C /tmp/verilator-src checkout --detach FETCH_HEAD
                  test "$(git -C /tmp/verilator-src rev-parse HEAD)" = "$VERILATOR_REVISION"
                  cd /tmp/verilator-src
                  autoconf
                  ./configure --prefix=/tmp/verilator-install
                  make -j2
                  make install
            - name: Check component ownership and source layout
              run: |
                  .toolchain/ci-python/bin/python -m unittest tools.test_check_conventions
            - name: Run independent protocol assertion fixtures
              run: .toolchain/ci-python/bin/python tools/run_assertions.py --verilator /tmp/verilator-install/bin/verilator --output sim/assertions-ci
            - name: Run randomized functional regression
              run: |
                  export VERILATOR_SOLVER="$PWD/.toolchain/ci-python/bin/z3 -in -smt2"
                  .toolchain/ci-python/bin/python tools/run_regression.py --verilator /tmp/verilator-install/bin/verilator --suite functional --seeds 1 17 29 43 --output sim/functional-ci --jobs 2
            - name: Run isolated component-unit tests
              run: |
                  export VERILATOR_SOLVER="$PWD/.toolchain/ci-python/bin/z3 -in -smt2"
                  .toolchain/ci-python/bin/python tools/run_regression.py --verilator /tmp/verilator-install/bin/verilator --suite unit --output sim/unit-ci --jobs 2
            - name: Preserve diagnostics and reports
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: ahb-validation
                  path: |
                      sim/**/*.json
                      sim/**/*.log
                  if-no-files-found: warn
